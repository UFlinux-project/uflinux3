# Portal backends for the labwc session. XDG_CURRENT_DESKTOP is set to "labwc"
# by uflinux-session, so xdg-desktop-portal reads this file. Only the interfaces
# understood by xdg-desktop-portal-wlr are pinned; everything else keeps the
# portal's own autodetection.
[preferred]
org.freedesktop.impl.portal.ScreenCast=wlr
