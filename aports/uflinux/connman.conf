[General]
PreferredTechnologies=ethernet,wifi
DefaultAutoConnectTechnologies=ethernet,wifi
AllowHostnameUpdates=false
AllowDomainnameUpdates=false
OnlineCheckMode=none
# The DNS proxy is enabled, so this file lists 127.0.0.1 and the real servers
# of the active service. Without it ConnMan would write /run/connman/resolv.conf
# and the image would keep the name servers baked in at build time.
ResolvConf=/etc/resolv.conf
# Only consulted when the active service announces no timeservers of its own.
# ConnMan resolves them through that service's name servers.
FallbackTimeservers=0.pool.ntp.org,1.pool.ntp.org,2.pool.ntp.org
