name = "uflinux-taskbar"
position = "bottom"
height = 40
anchor_to_edges = true
exclusive_zone = true
popup_gap = 0
popup_autohide = true

[[start]]
type = "custom"
name = "start-menu"
bar = [{ type = "button", name = "start-button", widgets = [{ type = "image", src = "file:///usr/share/icons/hicolor/scalable/apps/uflinux.svg", size = 28 }, { type = "label", label = "Menu" }], on_click = '!uflinux-start-menu --output "$IRONBAR_OUTPUT"', tooltip = "Start" }]

[[start]]
type = "launcher"
disable_popup = true
favorites = ["foot", "thunar"]
show_names = false
show_icons = true
icon_size = 24

[[end]]
type = "tray"
icon_size = 18

[[end]]
type = "custom"
name = "network-status"
bar = [{ type = "button", name = "network-button", widgets = [{ type = "icon", icon = "#uflinux_network_icon", fallback = "network-offline-symbolic", size = 18 }], on_click = '!uflinux-settings --panel network --output "$IRONBAR_OUTPUT"', tooltip = "#uflinux_network_tooltip" }]

[[end]]
type = "custom"
name = "sound-status"
bar = [{ type = "button", name = "sound-button", widgets = [{ type = "icon", icon = "#uflinux_sound_icon", fallback = "audio-volume-muted-symbolic", size = 18 }], on_click = '!uflinux-settings --panel sound --output "$IRONBAR_OUTPUT"', tooltip = "#uflinux_sound_tooltip" }]

[[end]]
type = "custom"
name = "power-status"
bar = [{ type = "button", name = "power-button", widgets = [{ type = "icon", icon = "#uflinux_power_icon", fallback = "thunderbolt-symbolic", size = 18 }], on_click = '!uflinux-settings --panel power --output "$IRONBAR_OUTPUT"', tooltip = "#uflinux_power_tooltip" }]

[[end]]
type = "clock"
format = "%H:%M\n%d/%m/%Y"
format_popup = "%A, %d %B %Y"
locale = "en_US"
