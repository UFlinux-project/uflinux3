name = "uflinux-taskbar"
position = "bottom"
height = 40
anchor_to_edges = true
exclusive_zone = true
popup_gap = 0
popup_autohide = true

[[start]]
type = "custom"
name = "start-menu"
bar = [{ type = "button", name = "start-button", widgets = [{ type = "image", src = "file:///usr/share/icons/hicolor/scalable/apps/uflinux.svg", size = 28 }], on_click = '!uflinux-start-menu --output "$IRONBAR_OUTPUT"', tooltip = "Start" }]

[[start]]
type = "launcher"
disable_popup = true
favorites = ["foot", "thunar"]
show_names = false
show_icons = true
icon_size = 24

[[end]]
type = "tray"
icon_size = 18

[[end]]
type = "custom"
name = "quick-settings"
bar = [{ type = "button", label = "#uflinux_network · #uflinux_volume", on_click = '!uflinux-settings --quick-settings --output "$IRONBAR_OUTPUT"', tooltip = "Network, sound and brightness" }]

# battery-start
[[end]]
type = "battery"
format = "{percentage}%"
# battery-end

[[end]]
type = "clock"
format = "%H:%M\n%d/%m/%Y"
format_popup = "%A, %d %B %Y"
locale = "en_US"
