<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- ConnMan SNTP is the clock owner. Its manager API is writable by group
       netdev, while net.connman.Clock mutation stays root-only, so a netdev
       user cannot bypass polkit by toggling automatic synchronization directly.
       Root is the trusted side: the privileged Settings helper authorizes
       through polkit before touching net.connman, and needs the whole
       destination because it also reads services and subscribes to signals.
       A user policy is applied after ConnMan's default-context deny, which is
       what makes this allow effective. Ordinary users keep the netdev group's
       Clock deny, which lives in ConnMan's own policy file. -->
  <policy user="root">
    <allow send_destination="net.connman"/>
  </policy>
</busconfig>
