<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- BusyBox is the clock owner; netdev must not bypass polkit through ConnMan. -->
  <policy context="mandatory">
    <deny send_destination="net.connman" send_interface="net.connman.Clock" send_member="SetProperty"/>
  </policy>
</busconfig>
