<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Ubuntu Nerd Font</family><family>Noto Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>UbuntuMono Nerd Font Mono</family><family>Noto Sans Mono</family></prefer></alias>
  <alias><family>Ubuntu Nerd Font</family><default><family>Noto Sans</family><family>sans-serif</family></default></alias>
  <alias><family>UbuntuMono Nerd Font Mono</family><default><family>Noto Sans Mono</family><family>monospace</family></default></alias>
</fontconfig>
