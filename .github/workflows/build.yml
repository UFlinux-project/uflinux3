name: Build and release UFLinux

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      vm: ${{ steps.matrix.outputs.vm }}
      packages: ${{ steps.matrix.outputs.packages }}
      version: ${{ steps.matrix.outputs.version }}
      epoch: ${{ steps.matrix.outputs.epoch }}
      cache: ${{ steps.matrix.outputs.cache }}
      release: ${{ steps.matrix.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check.py
      - name: Check Alpine package availability across all targets
        run: python3 scripts/check-packages.py
      - name: Validate shell and Actions workflows
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck
          shellcheck -S warning scripts/*.sh profiles/*.sh tests/*.sh aports/uflinux/uflinux-session aports/uflinux/uflinux-autostart aports/uflinux/uflinux-compositor aports/uflinux/uflinux-network-init settings/data/uflinux-acpid.initd settings/data/uflinux-power-button
          go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
          "$(go env GOPATH)/bin/actionlint" -config-file .github/actionlint.yaml .github/workflows/build.yml
      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: python3 scripts/ci-matrix.py

  compile:
    needs: checks
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.checks.outputs.packages) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      SOURCE_DATE_EPOCH: ${{ needs.checks.outputs.epoch }}
      APK_REPOSITORY_URL: ${{ vars.APK_REPOSITORY_URL }}
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare architecture emulation
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user-binfmt binfmt-support
          python3 scripts/preflight.py --arch '${{ matrix.arch }}'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: .cache/build/${{ matrix.package }}
          key: compile-v2-${{ matrix.arch }}-${{ matrix.package }}-${{ needs.checks.outputs.cache }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compile-v2-${{ matrix.arch }}-${{ matrix.package }}-${{ needs.checks.outputs.cache }}-
      - name: Compile without release secrets
        run: |
          timeout --signal=INT --kill-after=60s 300m sudo --preserve-env=SOURCE_DATE_EPOCH,APK_REPOSITORY_URL,CARGO_BUILD_JOBS,GITHUB_REPOSITORY,GITHUB_SHA bash scripts/build.sh --arch '${{ matrix.arch }}' --version '${{ needs.checks.outputs.version }}' --stage packages --package '${{ matrix.package }}'
      - name: Compare a clean native rebuild
        if: matrix.arch == 'x86_64'
        run: |
          timeout --signal=INT --kill-after=60s 40m sudo --preserve-env=SOURCE_DATE_EPOCH,APK_REPOSITORY_URL,CARGO_BUILD_JOBS,GITHUB_REPOSITORY,GITHUB_SHA python3 scripts/reproducibility.py --arch x86_64 --version '${{ needs.checks.outputs.version }}' --package '${{ matrix.package }}'
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .cache/build/${{ matrix.package }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-shard-${{ matrix.arch }}-${{ matrix.package }}
          retention-days: 7
          path: out/package-shards/${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  images:
    needs: [checks, compile]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.checks.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      SOURCE_DATE_EPOCH: ${{ needs.checks.outputs.epoch }}
      APK_REPOSITORY_URL: ${{ vars.APK_REPOSITORY_URL }}
      RELEASE: ${{ needs.checks.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-shard-${{ matrix.arch }}-*
          merge-multiple: true
          path: out/package-shards/${{ matrix.arch }}
      - name: Validate complete package set and combine build records
        run: python3 scripts/merge-packages.py --arch '${{ matrix.arch }}' --version '${{ needs.checks.outputs.version }}'
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user-binfmt binfmt-support
          python3 scripts/preflight.py --arch '${{ matrix.arch }}'
      - name: Sign packages and assemble ISO
        env:
          APK_SIGNING_PRIVATE_KEY: ${{ needs.checks.outputs.release == 'true' && secrets.APK_SIGNING_PRIVATE_KEY || '' }}
          APK_SIGNING_PUBLIC_KEY: ${{ needs.checks.outputs.release == 'true' && secrets.APK_SIGNING_PUBLIC_KEY || '' }}
        run: |
          release_args=()
          if [ "$RELEASE" = true ]; then release_args+=(--release); fi
          for stage in sign image; do
            sudo --preserve-env=SOURCE_DATE_EPOCH,APK_REPOSITORY_URL,GITHUB_REPOSITORY,GITHUB_SHA,APK_SIGNING_PRIVATE_KEY,APK_SIGNING_PUBLIC_KEY bash scripts/build.sh --arch '${{ matrix.arch }}' --version '${{ needs.checks.outputs.version }}' --stage "$stage" "${release_args[@]}"
          done
      - name: Verify signatures, desktop and installer checks
        run: |
          release_args=()
          if [ "$RELEASE" = true ]; then release_args+=(--release); fi
          sudo --preserve-env=SOURCE_DATE_EPOCH,APK_REPOSITORY_URL,GITHUB_REPOSITORY,GITHUB_SHA bash scripts/build.sh --arch '${{ matrix.arch }}' --version '${{ needs.checks.outputs.version }}' --stage verify "${release_args[@]}"
      - name: Exercise release signing and key cleanup with a disposable key
        if: matrix.arch == 'x86_64'
        run: sudo --preserve-env=SOURCE_DATE_EPOCH,APK_REPOSITORY_URL,GITHUB_REPOSITORY,GITHUB_SHA python3 tests/signing-smoke.py --arch x86_64 --version '${{ needs.checks.outputs.version }}'
      - name: Upload verification diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.arch }}
          path: out/checks/${{ matrix.arch }}
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          retention-days: 7
          path: |
            out/images
            out/repository
            out/metadata
            out/checks
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inputs-${{ matrix.arch }}
          retention-days: 7
          path: out/inputs
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  vm:
    needs: [checks, images]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.checks.outputs.vm) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.arch }}
          path: out
      - name: Install emulators and firmware
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-pexpect qemu-system-x86 qemu-system-arm qemu-system-ppc qemu-system-misc qemu-system-s390x ovmf qemu-efi-aarch64 qemu-efi-riscv64
      - name: Boot ISO, install XFS and reboot installed system
        run: |
          network=()
          if [ '${{ matrix.arch }}' = x86_64 ] && [ '${{ matrix.mode }}' = bios ]; then network+=(--network-tests); fi
          python3 scripts/vm-test.py --arch '${{ matrix.arch }}' --mode '${{ matrix.mode }}' --iso 'out/images/${{ matrix.arch }}/uflinux-${{ needs.checks.outputs.version }}-${{ matrix.arch }}.iso' "${network[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vm-${{ matrix.arch }}-${{ matrix.mode }}
          retention-days: 7
          path: out/vm
          if-no-files-found: error
          overwrite: true

  draft:
    if: needs.checks.outputs.release == 'true'
    needs: [checks, images, vm]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/release.py create --version "$VERSION"
        env:
          VERSION: ${{ needs.checks.outputs.version }}
          GH_TOKEN: ${{ github.token }}

  release-inputs:
    needs: [checks, draft]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.checks.outputs.matrix) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.checks.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inputs-${{ matrix.arch }}
          path: out/inputs
      - run: python3 scripts/release-inputs.py --arch '${{ matrix.arch }}' --version "$VERSION"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/uflinux-*.tar.gz
      - name: Upload inputs to the unpublished draft
        run: gh release upload "v$VERSION" --clobber out/uflinux-*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inputs-manifest-${{ matrix.arch }}
          retention-days: 7
          path: out/SHA256SUMS-*-inputs
          overwrite: true

  publish:
    if: needs.checks.outputs.release == 'true'
    needs: [checks, images, vm, release-inputs]
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.checks.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.checks.outputs.epoch }}
      APK_REPOSITORY_URL: ${{ vars.APK_REPOSITORY_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vm-*
          merge-multiple: true
          path: out/vm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: inputs-manifest-*
          merge-multiple: true
          path: out
      - run: python3 scripts/fetch-previous.py
      - name: Build complete signed APK repository
        env:
          APK_SIGNING_PRIVATE_KEY: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
          APK_SIGNING_PUBLIC_KEY: ${{ secrets.APK_SIGNING_PUBLIC_KEY }}
        run: |
          previous=()
          if [ -f out/previous/uflinux-apk-repository.tar.gz ]; then previous+=(--previous out/previous/uflinux-apk-repository.tar.gz); fi
          sudo --preserve-env=SOURCE_DATE_EPOCH,APK_REPOSITORY_URL,GITHUB_REPOSITORY,APK_SIGNING_PRIVATE_KEY,APK_SIGNING_PUBLIC_KEY python3 scripts/publish-repository.py --version "$VERSION" "${previous[@]}"
      - name: Check fresh clients and retained-version upgrades through the Pages layout
        run: |
          sudo --preserve-env=SOURCE_DATE_EPOCH,APK_REPOSITORY_URL,GITHUB_REPOSITORY python3 scripts/verify-repository.py --version "$VERSION" --staging out/pages/apk/v3.24/uflinux
          sudo --preserve-env=SOURCE_DATE_EPOCH python3 scripts/release-records.py --version "$VERSION"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/images/*/*.iso
            out/uflinux-*.tar.gz
            out/metadata/*/*.spdx.json
            out/SHA256SUMS
      - run: python3 scripts/release.py prepare --version "$VERSION"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/pages
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
      - name: Check the deployed signed repository before publishing the release
        run: |
          for attempt in 1 2 3; do
            if sudo --preserve-env=SOURCE_DATE_EPOCH,APK_REPOSITORY_URL,GITHUB_REPOSITORY python3 scripts/verify-repository.py --version "$VERSION"; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: published-repository-check
          path: out/checks/x86_64/repository-published.json
          if-no-files-found: ignore
          retention-days: 30
      - run: python3 scripts/release.py publish --version "$VERSION"
