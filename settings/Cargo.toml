[workspace]
members = ["core", "daemon", "system", "ui", "installer", "desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
glib = { version = "=0.21.3", features = ["v2_80"] }
gio = "=0.21.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "=1.0.151"
libc = "0.2"
async-channel = "2"
settings-core = { path = "core" }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 8
panic = "abort"
strip = false

[profile.test]
debug = 0
