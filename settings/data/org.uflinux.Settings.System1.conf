<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root"><allow own="org.uflinux.Settings.System1"/></policy>
  <!-- Every mutating method is authorized against its unique D-Bus sender. -->
  <policy context="default"><allow send_destination="org.uflinux.Settings.System1"/></policy>
</busconfig>
