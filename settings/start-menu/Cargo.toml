[package]
name = "uflinux-start-menu"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
glib.workspace = true
gio = { workspace = true, features = ["v2_80"] }
gtk = { package = "gtk4", version = "=0.10.1", features = ["v4_12"] }
